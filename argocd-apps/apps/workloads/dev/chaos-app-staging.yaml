apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-app-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/Yossi-Cohen19/Chaos-App-Project.git
    targetRevision: develop
    path: charts/chaos-generic
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
