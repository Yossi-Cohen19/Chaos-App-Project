{{- if .Values.clusterSecretStore.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: {{ .Values.clusterSecretStore.provider.aws.service }}
      region: {{ .Values.clusterSecretStore.provider.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore.provider.aws.auth.jwt.serviceAccountRef.name }}
            namespace: {{ .Values.clusterSecretStore.provider.aws.auth.jwt.serviceAccountRef.namespace }}
{{- end }}
