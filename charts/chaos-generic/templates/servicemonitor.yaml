{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chaos-generic.fullname" . }}
  labels:
    {{- include "chaos-generic.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chaos-generic.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
