{{- if .Values.serviceAccount.chaosRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chaos-generic.fullname" . }}-chaos-role
  labels:
    {{- include "chaos-generic.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chaos-generic.fullname" . }}-chaos-binding
  labels:
    {{- include "chaos-generic.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chaos-generic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "chaos-generic.fullname" . }}-chaos-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for node access (needed for cost analysis)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chaos-generic.fullname" . }}-nodes-reader
  labels:
    {{- include "chaos-generic.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chaos-generic.fullname" . }}-nodes-reader-binding
  labels:
    {{- include "chaos-generic.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chaos-generic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "chaos-generic.fullname" . }}-nodes-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
