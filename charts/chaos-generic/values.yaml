# Default values for chaos-generic.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 462645401469.dkr.ecr.us-east-1.amazonaws.com/chaos-platform-app-dev
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "sha-7303a983793802755624db93958a797a2f58e131"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  chaosRole: true

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: dev.yossi.site
      paths:
        - path: /
          pathType: Prefix

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# External Secret integration
externalSecret:
  enabled: false
  targetSecretName: "chaos-db-secret"
  data: []
  # - secretKey: DATABASE_URL
  #   remoteRef:
  #     key: chaos-secret
  #     property: DATABASE_URL

# Environment variables to pass to the container
env: []
# - name: FOO
#   value: "bar"

# New props
nextPublicEnvironment: "AWS EKS (dev)"
nextPublicCommitSha: "af0eb7b"
awsRegion: "us-east-1"
# ClusterSecretStore configuration
clusterSecretStore:
  enabled: false
  name: "chaos-secret-store"
  provider:
    aws:
      service: "SecretsManager"
      region: "us-east-1"
      auth:
        jwt:
      serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"

# Health probes configuration
healthProbes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Monitoring (Prometheus ServiceMonitor)
monitoring:
  enabled: false
  serviceMonitor:
    path: /metrics
    interval: 30s
