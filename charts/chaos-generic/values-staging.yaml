# Staging-specific overrides for chaos-generic Helm chart

replicaCount: 2

image:
  tag: "latest"  # Will be updated by CI/CD

ingress:
  enabled: true
  tls: true
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "stage.yossi.site"
  hosts:
    - host: stage.yossi.site
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  annotations: {}
  name: ""
  chaosRole: true

externalSecret:
  enabled: true
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: chaos-dev-db  # Shared DB in dev-cluster
        property: DATABASE_URL
  secretStoreRef:
    name: chaos-secret-store
    kind: ClusterSecretStore

# ClusterSecretStore configuration
clusterSecretStore:
  enabled: true  # Enable for staging to sync secrets from AWS
  name: "chaos-secret-store"
  provider:
    aws:
      service: "SecretsManager"
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: "external-secrets-sa"  # Fixed: correct SA name from Helm chart
            namespace: "external-secrets"

awsRegion: "us-east-1"
nextPublicEnvironment: "AWS EKS (staging)"
