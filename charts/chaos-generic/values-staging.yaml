# Staging-specific overrides for chaos-generic Helm chart

replicaCount: 2

image:
  tag: "latest"  # Will be updated by CI/CD

ingress:
  enabled: true
  hosts:
    - host: chaos-staging.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  annotations: {}
  name: ""
  chaosRole: true

externalSecret:
  enabled: true
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: chaos-dev-db  # Shared DB in dev-cluster
        property: DATABASE_URL

